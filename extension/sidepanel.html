<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paper Terminal — Monitor</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="dot" id="conn-dot"></span>
        <strong>Paper Terminal</strong>
        <span class="muted" id="conn-text">conectando…</span>
      </div>
      <div class="top-actions">
        <span class="muted" id="alert-status"></span>
        <button id="btn-reload" class="ghost tiny" title="Reconectar y recargar">⟳</button>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <button class="tab is-on" data-tab="alerts">Alertas <span class="count" id="count-alerts">0</span></button>
      <button class="tab" data-tab="fomo">FOMO <span class="count" id="count-fomo">0</span></button>
      <button class="tab" data-tab="photon">Photon</button>
      <button class="tab" data-tab="track">Track <span class="count" id="count-track">0</span></button>
      <button class="tab" data-tab="pump">Pump</button>
      <button class="tab" data-tab="config">Ajustes</button>
    </nav>

    <main id="view"></main>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
